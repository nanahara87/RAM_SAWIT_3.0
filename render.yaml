services:
  - type: web
    name: ram-sawit-online
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
    disk:
      name: ram-sawit-data
      mountPath: /var/data
      sizeGB: 1
